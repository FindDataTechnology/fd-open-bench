name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  e2e-tests:
    name: Playwright Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fd_open_bench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fd_open_bench_test
        run: |
          python scripts/init_db.py
          python scripts/seed_test_data.py

      - name: Start backend server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fd_open_bench_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: true
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8001 &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV
          sleep 5

      - name: Start frontend server
        run: |
          cd frontend
          npm run dev &
          echo "FRONTEND_PID=$!" >> $GITHUB_ENV
          cd ..
          sleep 5

      - name: Wait for servers
        run: |
          npx wait-on http://localhost:8001/health http://localhost:3001 -t 60000

      - name: Run Playwright tests
        env:
          E2E_API_URL: http://localhost:8001/api/v1
          E2E_BASE_URL: http://localhost:3001
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: test-results/
          retention-days: 30

      - name: Cleanup test data
        if: always()
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fd_open_bench_test
        run: python scripts/cleanup_test_data.py

      - name: Stop servers
        if: always()
        run: |
          kill $BACKEND_PID || true
          kill $FRONTEND_PID || true
