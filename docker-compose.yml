services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fd-open-bench-backend
    ports:
      - "8999:8999"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/fd_open_bench.db
      - FASTAPI_PORT=8999
    volumes:
      - fd_data:/data
    restart: unless-stopped
    networks:
      - fd-open-bench-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fd-open-bench-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - fd-open-bench-network

networks:
  fd-open-bench-network:
    driver: bridge

volumes:
  fd_data:
